[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beycounter"
version = "0.1.0"
description = "Beyblade X counter picker built on the official published part stats"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
beycounter = "beycounter.cli:main"

[tool.setuptools.packages.find]
include = ["beycounter*"]

[tool.setuptools.package-data]
beycounter = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
